[package]
name = "huhucapture-native"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
workspace = "../../../third_party/localsend"

[lib]
name = "huhucapture_native"
crate-type = ["rlib", "staticlib"]

[dependencies]
localsend = { path = "../../../third_party/localsend/core", features = ["discovery"] }
gifski = { git = "https://github.com/ImageOptim/gifski.git", rev = "1060eab4500a20f27e2fa3ab7e85473d0e921cbd", default-features = false, features = ["gifsicle"] }
bytes = "=1.12.1"
futures-util = "=0.3.33"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
