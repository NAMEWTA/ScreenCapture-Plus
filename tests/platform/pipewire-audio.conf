# Private validation graph, derived from fixed PipeWire 1.6.11 minimal.conf
# and pipewire.conf. No physical device, policy service or host config loads.
context.properties = {
    core.daemon = true
    core.name = huhu-audio-probe
    support.dbus = false
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum = 256
    default.clock.min-quantum = 256
    default.clock.max-quantum = 256
}
context.spa-libs = {
    support.* = support/libspa-support
    audio.convert.* = audioconvert/libspa-audioconvert
    audio.adapt = audioconvert/libspa-audioconvert
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]
context.objects = [
    { factory = spa-node-factory
      args = {
        factory.name = support.node.driver
        node.name = Huhu-Audio-Probe-Driver
        node.group = pipewire.dummy
        priority.driver = 20000
      }
    }
    { factory = adapter
      args = {
        factory.name = support.null-audio-sink
        node.name = huhu-audio-probe-sink
        node.description = "Owned CI system sink monitor"
        media.class = Audio/Sink
        node.virtual = true
        node.group = pipewire.dummy
        node.always-process = true
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        monitor.passthrough = true
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
      }
    }
]
