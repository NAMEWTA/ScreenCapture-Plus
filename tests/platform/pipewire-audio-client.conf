# Minimal private test client settings, from fixed 1.6.11 client.conf.
# Auto port configuration replaces only test graph policy; no native buffer or
# production callback is substituted. Every PCM buffer still traverses PipeWire.
context.properties = { support.dbus = false log.level = 2 }
context.spa-libs = {
    support.* = support/libspa-support
    audio.convert.* = audioconvert/libspa-audioconvert
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
]
stream.properties = {
    node.group = pipewire.dummy
    adapter.auto-port-config = { mode = dsp monitor = false position = preserve }
}
