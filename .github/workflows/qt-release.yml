name: Publish one verified complete Qt release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Exact current main commit already validated by all native workflows'
        type: string
        required: true
      application_run:
        description: 'Successful main Qt application release_candidate run ID'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: huhucapture-stable-release
  cancel-in-progress: false

jobs:
  admission:
    if: github.ref == 'refs/heads/main' && github.repository == 'NAMEWTA/huhucapture'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      source_commit: ${{ steps.admit.outputs.source_commit }}
      candidate_id: ${{ steps.admit.outputs.candidate_id }}
      bridge_commit: ${{ steps.admit.outputs.bridge_commit }}
      bridge_tag: ${{ steps.admit.outputs.bridge_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.17'
      - name: Admit only the successful canonical same-source formal candidate
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPLICATION_RUN: ${{ inputs.application_run }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          import types
          sys.path.insert(0, str(Path('scripts').resolve()))
          path = Path('scripts/publish-qt-release.py').resolve()
          release = types.ModuleType('release_admission'); release.__file__ = str(path)
          exec(compile(path.read_bytes(), str(path), 'exec'), release.__dict__)
          source = os.environ['SOURCE_COMMIT']; run = os.environ['APPLICATION_RUN']
          release.require(release.package.meta.HEX40.fullmatch(source) is not None, 'Exact source SHA required')
          release.require(release.command(['git', 'rev-parse', 'HEAD']).strip() == source, 'Requested source must be current main')
          release.verify_workflows(source, run)
          bridge = release.verify_published_bridge(release.read_version(release.ROOT))
          artifacts = []
          for page in release.api(f'actions/runs/{run}/artifacts?per_page=100', pages=True):
              artifacts += page['artifacts']
          expected = f'qt-release-candidate-{source}'
          matches = [item for item in artifacts if item['name'] == expected and item.get('expired') is False]
          release.require(len(matches) == 1 and matches[0]['size_in_bytes'] > 0, 'One live formal candidate artifact is required')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'source_commit={source}\ncandidate_id={matches[0]["id"]}\n')
              stream.write(f'bridge_commit={bridge["sourceCommit"]}\nbridge_tag={bridge["tag"]}\n')
          print('Admitted exact formal aggregate artifact', matches[0]['id'], 'from successful run', run)
          PY

  actual-legacy-about:
    needs: admission
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      evidence_id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.admission.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.admission.outputs.candidate_id }}
          run-id: ${{ inputs.application_run }}
          github-token: ${{ github.token }}
          path: artifacts/release-candidate
          merge-multiple: true
      - name: Verify the actual immutable complete aggregate
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ needs.admission.outputs.source_commit }}
        run: |
          python scripts/publish-qt-release.py verify --package artifacts/release-candidate --source-commit $env:SOURCE_COMMIT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check out the published bridge source for its native About regression
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.admission.outputs.bridge_commit }}
          path: artifacts/legacy-bridge
          persist-credentials: false
      - name: Build the historical Release and link its native About test
        shell: pwsh
        working-directory: artifacts/legacy-bridge
        run: |
          ./scripts/build.ps1 -Configuration Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-legacy-update.ps1 -Gui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Download the actual complete package through WinRT and the real About page
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_TAG: ${{ needs.admission.outputs.bridge_tag }}
        run: |
          gh release download $env:BRIDGE_TAG --repo NAMEWTA/huhucapture --pattern huhucapture.exe --dir artifacts/published-bridge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $legacy = 'artifacts/legacy-bridge/artifacts/tests/windows'
          python scripts/test-legacy-update.py --bridge-source artifacts/legacy-bridge --configuration Release --probe "$legacy/legacy-update/Release/LegacyUpdateProbe.exe" --gui-probe "$legacy/gui/GuiIntegrationTests.exe" --legacy-executable artifacts/published-bridge/huhucapture.exe --output artifacts/qt-bridge-test --real-package-directory artifacts/release-candidate --require-real-package
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Bind the native complete-package About evidence to the aggregate
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ needs.admission.outputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path artifacts/release-evidence | Out-Null
          Copy-Item -LiteralPath artifacts/qt-bridge-test/result.json -Destination artifacts/release-evidence/legacy-about.json
          python scripts/publish-qt-release.py verify --package artifacts/release-candidate --source-commit $env:SOURCE_COMMIT --bridge-evidence artifacts/release-evidence/legacy-about.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: evidence
        with:
          name: qt-actual-legacy-about-${{ github.run_id }}
          path: artifacts/release-evidence/legacy-about.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain actual native About diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qt-actual-legacy-about-diagnostics-${{ github.run_id }}
          path: |
            artifacts/qt-bridge-test/**/*.json
            artifacts/qt-bridge-test/**/*.log
            artifacts/qt-bridge-test/**/*.png
            artifacts/legacy-bridge/artifacts/*legacy-update*.binlog
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [admission, actual-legacy-about]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.admission.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.admission.outputs.candidate_id }}
          run-id: ${{ inputs.application_run }}
          github-token: ${{ github.token }}
          path: artifacts/release-candidate
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.actual-legacy-about.outputs.evidence_id }}
          path: artifacts/release-evidence
          merge-multiple: true
      - name: Create one new tag and draft, verify every uploaded byte, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.admission.outputs.source_commit }}
          APPLICATION_RUN: ${{ inputs.application_run }}
        run: |
          python scripts/publish-qt-release.py publish --package artifacts/release-candidate --source-commit "$SOURCE_COMMIT" --application-run "$APPLICATION_RUN" --bridge-evidence artifacts/release-evidence/legacy-about.json
