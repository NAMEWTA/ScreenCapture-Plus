            artifacts/native-build-sources/toolchain-notices/
            artifacts/native-rust/
            .deps/qt-runtime-linux/build-info.json
            .deps/qt-runtime-linux/source-plan-fragment.json
            .deps/qt-runtime-linux/control/
            .deps/qt-runtime-linux/*-source-receipt/
            .deps/qt-runtime-linux/install/sbom/
            .deps/qt-runtime-linux/*-build/CMakeCache.txt
            .deps/qt-runtime-linux/*-build/CMakeFiles/CMakeConfigureLog.yaml
            artifacts/qt-module-sources/restore-info.json
            artifacts/cmake/application-linux/CMakeCache.txt
            artifacts/cmake/application-linux/Testing/Temporary/
            artifacts/cmake/application-linux/screen-capture/
            artifacts/cmake/application-linux/capture-window/
            artifacts/cmake/application-linux/x11-capture/
            artifacts/cmake/application-linux/x11-capture-cancellation/
            artifacts/cmake/application-linux/x11-controls-evidence/
