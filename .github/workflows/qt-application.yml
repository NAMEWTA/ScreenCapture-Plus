  windows:
    needs: fixtures
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      AQT_CONFIG: ${{ github.workspace }}/build/aqt.ini
      CARGO_BUILD_JOBS: 2
    outputs:
      legacy_id: ${{ steps.legacy.outputs.artifact-id }}
      candidate_id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - name: Preserve exact repository bytes before source-receipt validation
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.12.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase qtsvg qttranslations
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4'
          py7zrversion: '==1.1.3'
          extra: '--external 7z'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.fixtures.outputs.fixture_id }}
          path: artifacts/video-fixtures
          merge-multiple: true
      - name: Build one source-attributed Windows Qt prefix
        id: qt_source
        shell: pwsh
        run: |
          python -m pip install spdx-tools==0.8.5 "reuse[charset-normalizer]==6.3.0"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/windows_qt_builder_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/restore-qt-module-sources.py --platform windows --workspace artifacts/qt-module-sources
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $referenceSdk = $env:QT_ROOT_DIR
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw 'The actual MSVC v143 x64 toolchain is required.' }
          & (Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python scripts/build-windows-qt.py --source-workspace artifacts/qt-module-sources --reference-sdk $referenceSdk --workspace .deps/qt-runtime-windows --jobs 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $prefix = (Resolve-Path .deps/qt-runtime-windows/install).Path
          # Only a successful complete source build becomes the application SDK.
          # All Qt libraries, plugins, tools and translations use this one prefix.
          "QT_ROOT_DIR=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QTDIR=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_PREFIX_PATH=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Qt6_DIR=$prefix/lib/cmake/Qt6" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QT_PLUGIN_PATH=$prefix/plugins" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$prefix/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build the exact release-CRT Rust aggregate and inspection DLLs
        id: application_dependencies
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/prepare-native-build-sources.py --output artifacts/native-build-sources
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build-native-rust.py --source-plan artifacts/native-build-sources/source-plan.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build-windows-video-inspection.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE/.deps/video-inspection-windows/install/Release/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure and link the complete Windows application
        id: application_build
        shell: pwsh
        run: |
          python scripts/build-application-with-sources.py --source-plan artifacts/native-build-sources/source-plan.json --native-receipt artifacts/native-rust/build-info.json --build-directory artifacts/cmake/application-windows --installed artifacts/install/windows --evidence artifacts/application-source-receipt "--cmake-argument=-DHUHUCAPTURE_RUNTIME_LICENSES=$env:GITHUB_WORKSPACE/.deps/video-inspection-windows/install/Release/licenses" "--cmake-argument=-DHUHUCAPTURE_LEGACY_MP3_FIXTURES=$env:GITHUB_WORKSPACE/artifacts/legacy-mp3-fixtures"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Generate and decode actual Windows H264 plus legacy MP3 audio
        shell: pwsh
        run: |
          & artifacts/cmake/application-windows/RelWithDebInfo/qt_legacy_mp3_recording.exe --generate artifacts/legacy-mp3-fixtures
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve real Windows-encoded files for independent Linux decoding
        id: legacy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qt-application-windows-legacy-mp3
          path: artifacts/legacy-mp3-fixtures/
          if-no-files-found: error
          retention-days: 14
      - name: Run real application, native recording, clipboard, media and transfer checks
        if: ${{ !cancelled() && steps.application_build.outcome == 'success' }}
        shell: pwsh
        run: ctest --preset qt-application-windows
      - name: Build the Windows product with validation disabled
        if: ${{ !cancelled() && steps.application_build.outcome == 'success' }}
        shell: pwsh
        run: |
          cmake -S . -B artifacts/cmake/application-runtime -G "Visual Studio 17 2022" -A x64 -T v143 -DHUHUCAPTURE_BUILD_APP=ON -DBUILD_TESTING=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Python3=ON "-DHUHUCAPTURE_RUNTIME_LICENSES=$env:GITHUB_WORKSPACE/.deps/video-inspection-windows/install/Release/licenses"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build artifacts/cmake/application-runtime --config RelWithDebInfo --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install the actual runtime and verify its native TLS backend
        id: runtime_install
        if: ${{ !cancelled() && steps.application_build.outcome == 'success' }}
        shell: pwsh
        run: |
          cmake --install artifacts/cmake/application-windows --config RelWithDebInfo --component Symbols --prefix "$env:GITHUB_WORKSPACE/artifacts/install/windows-symbols"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test-qt-package-runtime.py --prefix artifacts/install/windows --probe artifacts/cmake/application-windows/RelWithDebInfo/qt_package_runtime_probe.exe --certificate tests/fixtures/qt-tls/localhost-test-cert.pem --private-key tests/fixtures/qt-tls/localhost-test-key.pem --report artifacts/cmake/application-windows/package-runtime.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check original Windows notices, SDK bytes and the actual Rust graph
        if: ${{ !cancelled() && steps.runtime_install.outcome == 'success' }}
        shell: pwsh
        run: |
          python tests/runtime_materials_tests.py --cargo-metadata artifacts/native-rust/cargo-metadata.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Bind actual Qt runtime bytes to original SDK SPDX and official deployment
        if: ${{ !cancelled() && steps.runtime_install.outcome == 'success' }}
        shell: pwsh
        run: |
          python scripts/collect-runtime-materials.py qt --installed artifacts/install/windows --qt-prefix "$env:QT_ROOT_DIR" --build-directory artifacts/cmake/application-windows --configuration RelWithDebInfo --output artifacts/runtime-materials-qt-windows --module-source qtbase=artifacts/qt-module-sources/qtbase --module-source qtsvg=artifacts/qt-module-sources/qtsvg --module-source qttranslations=artifacts/qt-module-sources/qttranslations --module-source qttools=.deps/qt-runtime-windows/qttools-source --source-output artifacts/corresponding-sources-qt-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          import shutil
          source = Path('artifacts/runtime-materials-qt-windows')
          target = Path('artifacts/install/windows/licenses/collected-qt')
          shutil.copytree(source/'notices', target)
          shutil.copyfile(source/'qt-materials.json', target/'qt-materials.json')
          '@ | python
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain the actual Rust dependency sources and original notices
        if: ${{ !cancelled() && steps.runtime_install.outcome == 'success' }}
        shell: pwsh
        run: |
          python scripts/collect-runtime-materials.py rust --native-receipt artifacts/native-rust/build-info.json --cargo-metadata artifacts/native-rust/cargo-metadata.json --output artifacts/runtime-materials-rust-windows --source-output artifacts/corresponding-sources-rust-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          import shutil
          source = Path('artifacts/runtime-materials-rust-windows')
          target = Path('artifacts/install/windows/licenses/collected-rust')
          shutil.copytree(source/'notices', target)
          shutil.copyfile(source/'rust-materials.json', target/'rust-materials.json')
          '@ | python
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain the original Windows codec source and actual Release CRT configuration
        if: ${{ !cancelled() && steps.runtime_install.outcome == 'success' }}
        shell: pwsh
        run: |
          python scripts/collect-native-source-materials.py --installed artifacts/install/windows --output artifacts/runtime-materials-native-windows --source-output artifacts/corresponding-sources-native-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          import shutil
          source = Path('artifacts/runtime-materials-native-windows')
          target = Path('artifacts/install/windows/licenses/collected-native')
          shutil.copytree(source/'notices', target)
          shutil.copyfile(source/'native-materials.json', target/'native-materials.json')
          '@ | python
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify the actual Rust standard library and official toolchain notices
        if: ${{ !cancelled() && steps.runtime_install.outcome == 'success' }}
        shell: pwsh
        run: |
          $rustToolchainVersion = python -c 'import json; print(json.load(open("build/dependencies.lock.json"))["qtMigration"]["rustToolchain"])'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup component add rust-src --toolchain $rustToolchainVersion
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/collect-rust-toolchain-materials.py --native-receipt artifacts/native-rust/build-info.json --output artifacts/runtime-materials-rust-toolchain-windows --source-output artifacts/corresponding-sources-rust-toolchain-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          import shutil
          source = Path('artifacts/runtime-materials-rust-toolchain-windows')
          target = Path('artifacts/install/windows/licenses/collected-rust-toolchain')
          shutil.copytree(source/'notices', target)
          shutil.copyfile(source/'rust-toolchain-materials.json', target/'rust-toolchain-materials.json')
          '@ | python
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare final Windows payloads and the actual NSIS/ZIP candidate packages
        id: prepared
        if: ${{ !cancelled() && steps.runtime_install.outcome == 'success' }}
        shell: pwsh
        run: |
          python scripts/restore-packaging-tools.py --platform windows --output artifacts/packaging-tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/package_metadata_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $intent = @()
          if ($env:RELEASE_CANDIDATE -eq 'true') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Formal candidates require the canonical main checkout.' }
          } else { $intent += '--development' }
          python scripts/package-qt.py prepare --installed artifacts/install/windows --stage artifacts/packages/windows-prepared --minimum-system 'Windows 10 1809 x64' --symbols artifacts/install/windows-symbols/symbols --nsis-installer artifacts/packaging-tools/nsis/nsis-3.11-setup.exe @intent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain and independently reverify the exact prepared Windows stage
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        shell: pwsh
        run: |
          python scripts/retain-package-stage.py --stage artifacts/packages/windows-prepared --output artifacts/package-stage-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Assemble actual Windows sources and producer records for the final payloads
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        shell: pwsh
        run: |
          python scripts/collect-native-build-plans.py --output artifacts/native-source-plan-windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/assemble-source-plan.py --inputs artifacts/native-build-sources/source-plan.json --inputs .deps/qt-runtime-windows/source-plan-fragment.json --inputs artifacts/native-source-plan-windows/source-plan-fragment.json --receipt-plan artifacts/application-source-receipt/receipt-plan.json --stage artifacts/packages/windows-prepared --output artifacts/source-plan/windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Finalize exact Windows bytes with the required source-completeness boundary
        id: packages
        if: ${{ !cancelled() && steps.prepared.outcome == 'success' }}
        shell: pwsh
        run: |
          if ($env:RELEASE_CANDIDATE -eq 'true') {
            python scripts/package-qt.py finalize --stage artifacts/packages/windows-prepared --output artifacts/packages/windows --source-plan artifacts/source-plan/windows/source-plan.json --source-output artifacts/source-complete/windows
          } else {
            python scripts/package-qt.py finalize --stage artifacts/packages/windows-prepared --output artifacts/packages/windows --development
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            if (Test-Path artifacts/source-plan/windows/source-plan.json) {
              python scripts/create-source-bundle.py collect --plan artifacts/source-plan/windows/source-plan.json --output artifacts/source-complete/windows
            }
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install, run, reinstall and uninstall the real Windows package pair
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        shell: pwsh
        run: |
          python scripts/test-qt-installation.py --packages artifacts/packages/windows --probe artifacts/cmake/application-windows/RelWithDebInfo/installation_gui_probe.exe --video artifacts/video-fixtures/valid.mp4 --artifacts artifacts/cmake/application-windows/installation
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify changed-directory and stale-uninstaller ownership
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        shell: pwsh
        run: |
          $version = (Get-Content build/version.json -Raw | ConvertFrom-Json).version
          python scripts/test-windows-installer.py --installer "artifacts/packages/windows/huhucapture-v$version-windows-x64-setup.exe" --evidence artifacts/cmake/application-windows/installer-ownership
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Download both actual formal Windows packages through production Qt About
        if: ${{ !cancelled() && inputs.release_candidate && steps.packages.outcome == 'success' }}
        shell: pwsh
        run: |
          python scripts/test-qt-complete-update.py --package artifacts/packages/windows --probe artifacts/cmake/application-windows/RelWithDebInfo/qt_complete_update_probe.exe --output artifacts/cmake/application-windows/complete-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain the verified formal windows candidate
        id: candidate
        if: ${{ success() && inputs.release_candidate }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qt-formal-windows-${{ github.sha }}
          path: artifacts/packages/windows/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve actual Windows results and development artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qt-application-windows
          path: |
            artifacts/packages/windows/
            artifacts/package-stage-windows/
            artifacts/source-plan/windows/
            artifacts/source-complete/windows/
            artifacts/native-source-plan-windows/
