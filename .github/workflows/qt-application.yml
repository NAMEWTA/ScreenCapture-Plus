            artifacts/cmake/application-linux/scroll-capture/
            artifacts/cmake/application-linux/pipewire-audio/
            artifacts/cmake/application-linux/settings-controller-render/
            artifacts/cmake/application-linux/transfer-render/
            artifacts/cmake/application-linux/lan-controller-render/
            artifacts/cmake/application-linux/application-lifecycle/
            artifacts/cmake/application-linux/application-clipboard-owner/
            artifacts/cmake/application-linux/update-render/
            artifacts/cmake/application-linux/recording-render/
