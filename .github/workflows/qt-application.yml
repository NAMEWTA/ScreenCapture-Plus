  legacy-mp3-linux:
    needs: windows
    if: ${{ always() && needs.windows.outputs.legacy_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AQT_CONFIG: ${{ github.workspace }}/build/aqt.ini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install actual decoder build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build pkg-config nasm libxcb1-dev
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.12.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          archives: qtbase qtsvg icu
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4'
          py7zrversion: '==1.1.3'
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.windows.outputs.legacy_id }}
          path: artifacts/legacy-mp3-fixtures
          merge-multiple: true
      - name: Fully decode the unchanged Windows files with the Linux production decoder
        run: |
          python3 scripts/build-software-media.py
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/.deps/media-validation/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/.deps/media-validation/install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cmake -S . -B artifacts/cmake/legacy-mp3 -G Ninja -DCMAKE_BUILD_TYPE=Release -DHUHUCAPTURE_QT_VALIDATION=ON -DHUHUCAPTURE_FFMPEG_VALIDATION=ON -DHUHUCAPTURE_VIDEO_VALIDATION=ON -DHUHUCAPTURE_LEGACY_MP3_FIXTURES="$GITHUB_WORKSPACE/artifacts/legacy-mp3-fixtures"
          cmake --build artifacts/cmake/legacy-mp3 --target qt_legacy_mp3_recording --parallel 2
          ctest --test-dir artifacts/cmake/legacy-mp3 -R '^qt_legacy_mp3_recording$' --output-on-failure --no-tests=error
      - name: Retain actual same-byte compatibility results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qt-application-legacy-mp3-linux
          path: |
            artifacts/cmake/legacy-mp3/Testing/Temporary/
            artifacts/legacy-mp3-fixtures/legacy-mp3-manifest.json
            .deps/media-validation/build-info.json
          if-no-files-found: warn
          retention-days: 14
