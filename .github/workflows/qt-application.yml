name: Unified Qt application and development packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-application-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AQT_CONFIG: ${{ github.workspace }}/build/aqt.ini
    outputs:
      fixture_id: ${{ steps.fixtures.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install actual native codec prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build pkg-config nasm libxcb1-dev
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.12.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          archives: qtbase qtsvg icu
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4'
          py7zrversion: '==1.1.3'
          cache: false
      - name: Build the locked codecs and generate one set of real shared files
        run: |
          python3 scripts/build-software-media.py
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/.deps/media-validation/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/.deps/media-validation/install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cmake -S . -B artifacts/cmake/fixtures -G Ninja -DCMAKE_BUILD_TYPE=Release -DHUHUCAPTURE_QT_VALIDATION=ON -DHUHUCAPTURE_FFMPEG_VALIDATION=ON -DHUHUCAPTURE_VIDEO_VALIDATION=ON
          cmake --build artifacts/cmake/fixtures --target video_inspection_fixtures --parallel 2
          artifacts/cmake/fixtures/video_inspection_fixtures artifacts/video-fixtures
          python3 scripts/build-hevc-fixtures.py --fixtures artifacts/video-fixtures --generator artifacts/cmake/fixtures/video_inspection_fixtures
      - name: Retain the identical encoded and deliberately damaged bytes
        id: fixtures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qt-application-video-fixtures
          path: artifacts/video-fixtures/
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AQT_CONFIG: ${{ github.workspace }}/build/aqt.ini
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install actual desktop, compiler and packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y meson ninja-build pkg-config nasm dbus libglib2.0-dev libglib2.0-dev-bin libwayland-dev libwayland-bin libxkbcommon-dev libxkbcommon-x11-dev libgl-dev libegl-dev libxcb1-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-xtest0-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-xinput0 fonts-noto-cjk xvfb xauth x11-utils patchelf zstd squashfs-tools libssl-dev ca-certificates
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.12.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          archives: qtbase qtsvg qtwayland qttranslations icu
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4'
          py7zrversion: '==1.1.3'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.fixtures.outputs.fixture_id }}
          path: artifacts/video-fixtures
          merge-multiple: true
      - name: Build the exact application dependencies
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          python scripts/build-native-rust.py
          python scripts/build-portal.py
          python scripts/build-pipewire.py
          python scripts/build-software-media.py
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/.deps/portal-validation/install/lib/pkgconfig:$GITHUB_WORKSPACE/.deps/pipewire-validation/install/lib/pkgconfig:$GITHUB_WORKSPACE/.deps/media-validation/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.deps/portal-validation/install/lib:$GITHUB_WORKSPACE/.deps/pipewire-validation/install/lib:$GITHUB_WORKSPACE/.deps/media-validation/install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "PIPEWIRE_MODULE_DIR=$GITHUB_WORKSPACE/.deps/pipewire-validation/install/lib/pipewire-0.3" >> "$GITHUB_ENV"
          echo "SPA_PLUGIN_DIR=$GITHUB_WORKSPACE/.deps/pipewire-validation/install/lib/spa-0.2" >> "$GITHUB_ENV"
          echo "PIPEWIRE_CONFIG_DIR=$GITHUB_WORKSPACE/.deps/pipewire-validation/install/share/pipewire" >> "$GITHUB_ENV"
      - name: Preserve the actual native dependency notices
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, subprocess, json
          destination=Path('artifacts/runtime-licenses')
          for name,source in [('portal','.deps/portal-validation/source'),('pipewire','.deps/pipewire-validation/source'),('ffmpeg','.deps/media-validation/ffmpeg-source'),('x264','.deps/media-validation/x264-source')]:
              files=[p for p in Path(source).iterdir() if p.is_file() and p.name.upper().startswith(('LICENSE','COPYING','NOTICE'))]
              if not files: raise RuntimeError('Actual upstream notices absent: '+name)
              folder=destination/name;folder.mkdir(parents=True)
              for file in files: shutil.copy2(file,folder/file.name)
          runtime=Path('/usr/lib/x86_64-linux-gnu')
          packages={}
          for name in ('libssl.so.3','libcrypto.so.3'):
              file=runtime/name
              owner=subprocess.check_output(['dpkg-query','-S',str(file)],text=True).strip().split(': ',1)[0]
              package=owner.split(':',1)[0]
              notice=Path('/usr/share/doc')/package/'copyright'
              if not file.is_file() or not notice.is_file(): raise RuntimeError('Missing actual OpenSSL runtime/notice')
              folder=destination/'system';folder.mkdir(exist_ok=True)
              shutil.copy2(notice,folder/(package+'.copyright'))
              packages[owner]=subprocess.check_output(['dpkg-query','-W','-f=${Version}',owner],text=True)
          (destination/'system/packages.json').write_text(json.dumps(packages,indent=2)+'\n')
          PY
      - name: Configure and link the complete application with real platform services
        run: |
          cmake --preset qt-application-linux -DHUHUCAPTURE_RUNTIME_LICENSES="$GITHUB_WORKSPACE/artifacts/runtime-licenses" -DHUHUCAPTURE_OPENSSL_RUNTIME_DIR=/usr/lib/x86_64-linux-gnu
          cmake --build --preset qt-application-linux --parallel 2
      - name: Run real application, X11, IPC, media, TLS, Portal-failure and shutdown checks
        run: ctest --preset qt-application-linux
      - name: Verify production configuration without test daemons
        run: cmake -S . -B artifacts/cmake/application-runtime -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHUHUCAPTURE_BUILD_APP=ON -DBUILD_TESTING=OFF -DHUHUCAPTURE_RUNTIME_LICENSES="$GITHUB_WORKSPACE/artifacts/runtime-licenses"
      - name: Deploy the linked runtime and verify actual development packages
        run: |
          cmake --install artifacts/cmake/application-linux --config RelWithDebInfo --prefix "$GITHUB_WORKSPACE/artifacts/install/linux"
          python scripts/test-qt-package-runtime.py --prefix artifacts/install/linux --probe artifacts/cmake/application-linux/qt_package_runtime_probe --certificate tests/fixtures/qt-tls/localhost-test-cert.pem --private-key tests/fixtures/qt-tls/localhost-test-key.pem --report artifacts/cmake/application-linux/package-runtime.json
          python scripts/restore-packaging-tools.py --platform linux --output artifacts/packaging-tools
          python tests/package_metadata_tests.py
          python scripts/package-qt.py package --installed artifacts/install/linux --output artifacts/packages/linux --minimum-system 'Ubuntu 24.04 amd64; desktop acceptance pending' --tools artifacts/packaging-tools --qmake "$QT_ROOT_DIR/bin/qmake" --development
      - name: Preserve actual evidence and clearly marked development artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qt-application-linux
          path: |
            artifacts/packages/linux/
            artifacts/cmake/application-linux/CMakeCache.txt
            artifacts/cmake/application-linux/Testing/Temporary/
            artifacts/cmake/application-linux/x11-capture/
            artifacts/cmake/application-linux/settings-controller-render/
            artifacts/cmake/application-linux/editor-render/
            artifacts/cmake/application-linux/package/
            artifacts/cmake/application-linux/package-runtime.json
            artifacts/native-rust/build-info.json
            .deps/portal-validation/build-info.json
            .deps/pipewire-validation/build-info.json
            .deps/media-validation/build-info.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  windows:
    needs: fixtures
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      AQT_CONFIG: ${{ github.workspace }}/build/aqt.ini
      CARGO_BUILD_JOBS: 2
    outputs:
      legacy_id: ${{ steps.legacy.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.12.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase qtsvg qttranslations
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4'
          py7zrversion: '==1.1.3'
          extra: '--external 7z'
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.fixtures.outputs.fixture_id }}
          path: artifacts/video-fixtures
          merge-multiple: true
      - name: Build the exact release-CRT Rust aggregate and inspection DLLs
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build-native-rust.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build-windows-video-inspection.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$env:GITHUB_WORKSPACE/.deps/video-inspection-windows/install/Release/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure and link the complete Windows application
        shell: pwsh
        run: |
          cmake --preset qt-application-windows "-DHUHUCAPTURE_RUNTIME_LICENSES=$env:GITHUB_WORKSPACE/.deps/video-inspection-windows/install/Release/licenses" "-DHUHUCAPTURE_LEGACY_MP3_FIXTURES=$env:GITHUB_WORKSPACE/artifacts/legacy-mp3-fixtures"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset qt-application-windows --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Generate and decode actual Windows H264 plus legacy MP3 audio
        shell: pwsh
        run: |
          & artifacts/cmake/application-windows/RelWithDebInfo/qt_legacy_mp3_recording.exe --generate artifacts/legacy-mp3-fixtures
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve real Windows-encoded files for independent Linux decoding
        id: legacy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qt-application-windows-legacy-mp3
          path: artifacts/legacy-mp3-fixtures/
          if-no-files-found: error
          retention-days: 14
      - name: Run real application, native recording, clipboard, media and transfer checks
        shell: pwsh
        run: ctest --preset qt-application-windows
      - name: Install and verify complete portable and per-user setup packages
        shell: pwsh
        run: |
          cmake --install artifacts/cmake/application-windows --config RelWithDebInfo --prefix "$env:GITHUB_WORKSPACE/artifacts/install/windows"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install artifacts/cmake/application-windows --config RelWithDebInfo --component Symbols --prefix "$env:GITHUB_WORKSPACE/artifacts/install/windows-symbols"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/test-qt-package-runtime.py --prefix artifacts/install/windows --probe artifacts/cmake/application-windows/RelWithDebInfo/qt_package_runtime_probe.exe --certificate tests/fixtures/qt-tls/localhost-test-cert.pem --private-key tests/fixtures/qt-tls/localhost-test-key.pem --report artifacts/cmake/application-windows/package-runtime.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/restore-packaging-tools.py --platform windows --output artifacts/packaging-tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/package_metadata_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/package-qt.py package --installed artifacts/install/windows --output artifacts/packages/windows --minimum-system 'Windows 10 1809 x64; desktop acceptance pending' --symbols artifacts/install/windows-symbols/symbols --nsis-installer artifacts/packaging-tools/nsis/nsis-3.11-setup.exe --development
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Preserve actual Windows results and development artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qt-application-windows
          path: |
            artifacts/packages/windows/
            artifacts/cmake/application-windows/CMakeCache.txt
            artifacts/cmake/application-windows/Testing/Temporary/
            artifacts/cmake/application-windows/editor-render/
            artifacts/cmake/application-windows/settings-controller-render/
            artifacts/cmake/application-windows/native-recording/
            artifacts/legacy-mp3-fixtures/
            artifacts/cmake/application-windows/package/
            artifacts/cmake/application-windows/package-runtime.json
            artifacts/native-rust/build-info.json
            .deps/video-inspection-windows/build-info.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  legacy-mp3-linux:
    needs: windows
    if: ${{ always() && needs.windows.outputs.legacy_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AQT_CONFIG: ${{ github.workspace }}/build/aqt.ini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install actual decoder build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build pkg-config nasm libxcb1-dev
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.12.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          archives: qtbase qtsvg icu
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4'
          py7zrversion: '==1.1.3'
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.windows.outputs.legacy_id }}
          path: artifacts/legacy-mp3-fixtures
          merge-multiple: true
      - name: Fully decode the unchanged Windows files with the Linux production decoder
        run: |
          python3 scripts/build-software-media.py
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/.deps/media-validation/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/.deps/media-validation/install/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cmake -S . -B artifacts/cmake/legacy-mp3 -G Ninja -DCMAKE_BUILD_TYPE=Release -DHUHUCAPTURE_QT_VALIDATION=ON -DHUHUCAPTURE_FFMPEG_VALIDATION=ON -DHUHUCAPTURE_VIDEO_VALIDATION=ON -DHUHUCAPTURE_LEGACY_MP3_FIXTURES="$GITHUB_WORKSPACE/artifacts/legacy-mp3-fixtures"
          cmake --build artifacts/cmake/legacy-mp3 --target qt_legacy_mp3_recording --parallel 2
          ctest --test-dir artifacts/cmake/legacy-mp3 -R '^qt_legacy_mp3_recording$' --output-on-failure --no-tests=error
      - name: Retain actual same-byte compatibility results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qt-application-legacy-mp3-linux
          path: |
            artifacts/cmake/legacy-mp3/Testing/Temporary/
            artifacts/legacy-mp3-fixtures/legacy-mp3-manifest.json
            .deps/media-validation/build-info.json
          if-no-files-found: warn
          retention-days: 14
