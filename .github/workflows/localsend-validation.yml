name: LocalSend core validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localsend-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/cargo/localsend
      RUST_BACKTRACE: 1
    defaults:
      run:
        working-directory: third_party/localsend
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore the exact upstream Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustc --version --verbose
          cargo --version
      - name: Run real TLS, filesystem and bounded transfer tests
        # The first standalone-workspace resolution must be done by Cargo.
        # Its lock is retained below, reviewed, then committed for --locked use.
        run: cargo test -p localsend --features discovery --no-fail-fast
      - name: Retain the actual workspace dependency resolution
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: localsend-cargo-lock-${{ runner.os }}
          path: third_party/localsend/Cargo.lock
          if-no-files-found: error
          retention-days: 14
