name: Isolated Linux development dependencies

on:
  push:
    paths:
      - '.github/workflows/development-dependencies.yml'
      - 'scripts/bundle-development-dependencies.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AQT_CONFIG: ${{ github.workspace }}/build/aqt.ini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install official runner build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y meson ninja-build pkg-config nasm dbus libglib2.0-dev libglib2.0-dev-bin libwayland-dev libwayland-bin libxkbcommon-dev libgl-dev libegl-dev libxcb1-dev libxcb-keysyms1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-xtest0-dev
      - name: Restore the fixed official Qt SDK archives
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.12.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          archives: qtbase qtsvg qtwayland icu
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4'
          py7zrversion: '==1.1.3'
          cache: false
      - name: Build the same locked native dependencies
        run: |
          python3 scripts/build-portal.py
          python3 scripts/build-pipewire.py
          python3 scripts/build-software-media.py
      - name: Bundle complete prefixes, native development files and licenses
        run: |
          python3 scripts/bundle-development-dependencies.py create --qt-prefix "$QT_ROOT_DIR" --output artifacts/development-dependencies
      - name: Restore into a different empty prefix and verify every file
        run: |
          archive=artifacts/development-dependencies/huhucapture-development-linux-amd64.tar.gz
          checksum=$(cut -d ' ' -f 1 "$archive.sha256")
          python3 scripts/bundle-development-dependencies.py restore --archive "$archive" --sha256 "$checksum" --destination artifacts/relocated-development
      - name: Prove current Portal and PipeWire targets link with the restored SDK
        run: |
          # These four prefixes were created by this job; retain them under a
          # different name so an embedded original-prefix reference cannot pass.
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          metadata = json.loads(Path('artifacts/development-dependencies/metadata.json').read_text())
          sources = {'qt': Path(os.environ['QT_ROOT_DIR']).resolve(),
                     'portal': Path('.deps/portal-validation/install').resolve(),
                     'pipewire': Path('.deps/pipewire-validation/install').resolve(),
                     'media': Path('.deps/media-validation/install').resolve()}
          for name, source in sources.items():
              assert str(source) == metadata['originalPrefixes'][name]
              target = source.with_name(source.name + '.bundle-original')
              if target.exists():
                  raise RuntimeError('Original-prefix proof destination already exists')
              source.rename(target)
          PY
          source artifacts/relocated-development/sdk/environment.sh
          test "$(qmake -query QT_INSTALL_PREFIX)" = "$QT_ROOT_DIR"
          cmake --version
          ninja --version
          pkg-config --modversion libportal libportal-qt6 libpipewire-0.3 gio-2.0 wayland-client xcb-shm xcb-xfixes xcb-xtest
          test "$(pkg-config --variable=prefix gio-2.0)" = "$(pwd)/artifacts/relocated-development/sdk/system/usr"
          test "$(pkg-config --variable=prefix libportal)" = "$(pwd)/artifacts/relocated-development/sdk/portal"
          cmake -S . -B artifacts/cmake/relocated-development -G Ninja -DCMAKE_BUILD_TYPE=Debug -DHUHUCAPTURE_QT_VALIDATION=ON -DHUHUCAPTURE_PORTAL_VALIDATION=ON -DHUHUCAPTURE_PIPEWIRE_VALIDATION=ON -DHUHUCAPTURE_FFMPEG_VALIDATION=ON
          cmake --build artifacts/cmake/relocated-development --target portal_capture_probe pipewire_capture_probe pipewire_fd_tests qt_software_codec --parallel 2
          ctest --test-dir artifacts/cmake/relocated-development -R '^(pipewire_fd_tests|qt_software_codec)$' --output-on-failure
      - name: Preserve the development SDK and actual relocation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: development-dependencies-linux-amd64
          path: |
            artifacts/development-dependencies/*.tar.gz
            artifacts/development-dependencies/*.sha256
            artifacts/development-dependencies/manifest.json
            artifacts/development-dependencies/metadata.json
            artifacts/relocated-development/sdk/relocation.json
            artifacts/cmake/relocated-development/CMakeCache.txt
          compression-level: 0
          if-no-files-found: warn
          retention-days: 14
