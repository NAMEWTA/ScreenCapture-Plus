name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild and upload (leave empty for artifacts only)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name }}-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
          persist-credentials: false

      - name: Build the release executable and pinned dependencies
        run: ./scripts/build.ps1 -Configuration Release -Version $env:RELEASE_TAG

      - name: Run core regression tests
        run: ./scripts/test.ps1

      - name: Verify native annotation rendering and PNG export
        run: ./scripts/test-windows.ps1

      - name: Check single-executable tray startup
        run: ./scripts/smoke.ps1

      - name: Verify the debug configuration
        if: github.event_name != 'release' && inputs.release_tag == ''
        run: ./scripts/build.ps1 -Configuration Debug -SkipRestore

      - name: Package and verify the single executable
        run: ./scripts/package.ps1 -Version $env:RELEASE_TAG

      - name: Retain executable, symbols, and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: windows-x64
          path: artifacts/package/*
          if-no-files-found: error
          retention-days: 14

      - name: Verify real annotation editor interactions and clipboard export
        run: ./scripts/test-windows.ps1 -Gui

      - name: Retain diagnostic build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: windows-build-logs
          path: |
            artifacts/*.binlog
            artifacts/dependencies/gifski-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain native render test images and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: windows-render-checks
          path: artifacts/tests/windows/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: windows-x64
          path: package

      - name: Upload assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GH_REPO"
          gh release upload "$RELEASE_TAG" package/* --repo "$GH_REPO" --clobber

  publish-declared-release:
    # Only a reviewed releases/publish.json declaration chooses a new version.
    # Ordinary commits keep already-published versions intact. This job uploads
    # the same tested artifact; GITHUB_TOKEN events do not start a second build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'NAMEWTA/huhucapture'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: declared-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out the tested release declaration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: windows-x64
          path: package

      - name: Publish the declared stable release exactly once
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1 -PackageDirectory package
